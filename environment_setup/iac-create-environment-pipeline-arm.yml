pr: none
trigger: none

variables:
- group: mlops-wsh-dsrp

stages:
- stage: 'Dev'
  displayName: 'Dev'
  jobs:
  - job: "Provision_Dev"
    displayName: "Provision Dev resources"
    pool:
      vmImage: 'ubuntu-latest'
    timeoutInMinutes: 0
    steps:
    - task: AzureResourceGroupDeployment@2
      inputs:
        azureSubscription: '$(AZURE_RM_SVC_CONNECTION)'
        action: 'Create Or Update Resource Group'
        resourceGroupName: '$(RESOURCE_GROUP)'
        location: $(LOCATION)
        templateLocation: 'Linked artifact'
        csmFile: '$(Build.SourcesDirectory)/environment_setup/cloud-environment.json'
        overrideParameters: '-baseName $(BASE_NAME) -location $(LOCATION) -workspace $(WORKSPACE_NAME)'
        deploymentMode: 'Incremental'
      displayName: 'Deploy OH resources to Azure'

- stage: Build

  dependsOn: Dev

  jobs:

  - job: Build_ML

    pool:
      vmImage: ubuntu-latest

    steps:

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.11'

    - script: |
        pip install -r source/requirements.txt
      displayName: Install dependencies

    - script: |
        ruff check .
      displayName: Ruff Check

    - script: |
        pytest
      displayName: Run Tests

    - script: |
        python source/train.py
      displayName: Train Model

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: artifacts
        artifact: model
