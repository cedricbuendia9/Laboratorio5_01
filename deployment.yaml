apiVersion: apps/v1
kind: Deployment
metadata:
  name: diabetes-api

spec:
  replicas: 2

  selector:
    matchLabels:
      app: diabetes-api

  template:
    metadata:
      labels:
        app: diabetes-api

    spec:
      containers:
      - name: diabetes-api

        image: cedricbuendia/diabetes-model:latest

        ports:
        - containerPort: 5000